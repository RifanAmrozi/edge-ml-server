[phases.setup]
nixPkgs = [
    "python310",
    "pip",
    "gcc",
    "glib",
    "libGL",
    "libGLU",
    "mesa",
    "xorg.libX11",
    "xorg.libXext",
    "xorg.libXrender",
    "xorg.libXtst",
    "xorg.libXi",
    "ffmpeg",
    "pkg-config"
]

[phases.install]
dependsOn = ["setup"]
cmds = [
    "pip install --upgrade pip",
    "pip install -r requirements.txt"
]

[start]
cmd = "uvicorn app:app --host 0.0.0.0 --port $PORT"